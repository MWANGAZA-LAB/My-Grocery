[variables]
NODE_ENV = "production"
CI = "false"
GENERATE_SOURCEMAP = "false"
NODE_OPTIONS = "--max-old-space-size=512"

[phases.setup]
nixPkgs = ["nodejs_20", "npm"]

[phases.install]
cmd = "cd grocery-list && npm ci"

[phases.build]
cmd = "cd grocery-list && npm run build:railway"

[phases.start]
cmd = "cd grocery-list && npm run start:prod"

[start]
cmd = "cd grocery-list && npm run start:prod"
